# Tool settings only. This repo is not a package.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# An explicit list, because the default rules change between ruff versions.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
